        <!-- Background SVG Shape -->
    <div class="bg-layer" id="bg-layer">
        
        <!-- NEW: SVG Clip Path Definitions mapping exactly to the background curve -->
        <svg width="0" height="0" style="position:absolute;">
            <defs>
                <!-- clipPathUnits="objectBoundingBox" allows values 0 to 1 scaling with screen -->
                <clipPath id="left-clip" clipPathUnits="objectBoundingBox">
                    <path d="M0,0 L1,0 C0.8,0.5 0.2,0.5 0,1 Z"></path>
                </clipPath>
                <!-- Exact inverse of the curve to mask the right side -->
                <clipPath id="right-clip" clipPathUnits="objectBoundingBox">
                    <path d="M1,0 L1,1 L0,1 C0.2,0.5 0.8,0.5 1,0 Z"></path>
                </clipPath>
            </defs>
        </svg>

        <!-- viewBox 0 0 100 100 with preserveAspectRatio="none" ensures it stretches perfectly to any screen size -->
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%;">
            <!-- 
                This path now creates a perfectly balanced 50/50 split.
                L100,0: Stretches all the way to the top-right edge.
                C80,50 20,50 0,100: Creates a smooth, balanced S-curve all the way to the bottom-left edge.
            -->
            <path class="shape-fill" d="M100,0 C80,50 20,50 0,100 L100,100 Z"></path>
        </svg>
    </div>
