    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

<body>

    <header class="top-nav-wrapper">
        <div class="nav-container">

            </nav>
        </div>
    </header>

    <!-- Background SVG Shape -->
    <div class="bg-layer" id="bg-layer">
        
        <!-- NEW: SVG Clip Path Definitions mapping exactly to the background curve -->
        <svg width="0" height="0" style="position:absolute;">
            <defs>
                <!-- clipPathUnits="objectBoundingBox" allows values 0 to 1 scaling with screen -->
                <clipPath id="left-clip" clipPathUnits="objectBoundingBox">
                    <path d="M0,0 L1,0 C0.8,0.5 0.2,0.5 0,1 Z"></path>
                </clipPath>
                <!-- Exact inverse of the curve to mask the right side -->
                <clipPath id="right-clip" clipPathUnits="objectBoundingBox">
                    <path d="M1,0 L1,1 L0,1 C0.2,0.5 0.8,0.5 1,0 Z"></path>
                </clipPath>
            </defs>
        </svg>

        <!-- viewBox 0 0 100 100 with preserveAspectRatio="none" ensures it stretches perfectly to any screen size -->
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%;">
            <!-- 
                This path now creates a perfectly balanced 50/50 split.
                L100,0: Stretches all the way to the top-right edge.
                C80,50 20,50 0,100: Creates a smooth, balanced S-curve all the way to the bottom-left edge.
            -->
            <path class="shape-fill" d="M0,0 L100,0 C80,50 20,50 0,100 Z"></path>
        </svg>
    </div>

    <!-- NEW: Strictly Clipped Left Zone (Digital Side) -->
    <div class="zone left-zone">
        <div class="parallax-el" data-speed="25" style="top: 15%; left: 10%;">
            <div class="glass-card">
                <span class="text-4xl">🎨</span>
                <span class="card-title">Vector Logos</span>
            </div>
        </div>
        <div class="parallax-el" data-speed="15" style="top: 60%; left: 20%;">
            <div class="glass-card delay-1">
                <span class="text-4xl">📱</span>
                <span class="card-title">UI Prototyping</span>
            </div>
        </div>
    </div>

    <!-- NEW: Strictly Clipped Right Zone (Physical Side) -->
    <div class="zone right-zone">
        <div class="parallax-el" data-speed="30" style="bottom: 20%; right: 10%;">
            <div class="glass-card delay-2">
                <span class="text-4xl">🧶</span>
                <span class="card-title">yy</span>
            </div>
        </div>
        <div class="parallax-el" data-speed="20" style="top: 25%; right: 25%;">
            <div class="glass-card delay-1">
                <span class="text-4xl">📍</span>
                <span class="card-title">E</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="title">
            <h1>WELCOME</h1>
        </div>
        
        <!-- SVG Star -->
        <svg class="star" viewBox="0 0 24 24">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
        </svg>
    </div>

    <script src="script.js"></script>
</body>
