    <!-- Background SVG Shape -->
    <div class="bg-layer" id="bg-layer">
        
        <!-- SVG Clip Path Definitions mapping exactly to the vertical wave -->
        <svg width="0" height="0" style="position:absolute;">
            <defs>
                <clipPath id="left-clip" clipPathUnits="objectBoundingBox">
                    <!-- Masks exactly the wavy left side -->
                    <path d="M0,0 L0.5,0 C0.7,0.33 0.3,0.66 0.5,1 L0,1 Z"></path>
                </clipPath>
                <clipPath id="right-clip" clipPathUnits="objectBoundingBox">
                    <!-- Masks exactly the wavy right side -->
                    <path d="M0.5,0 C0.7,0.33 0.3,0.66 0.5,1 L1,1 L1,0 Z"></path>
                </clipPath>
            </defs>
        </svg>

        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%;">
            <!-- 
                This path draws the wavy vertical split.
                L50,0: Starts at the top center.
                C70,33 30,66 50,100: Swoops outward to the right (70%), then inward to the left (30%), before ending back at the bottom center (50,100).
            -->
            <path class="shape-fill" d="M100,0 L50,0 C70,33 30,66 50,100 L100,100 Z"></path>
        </svg>
    </div>
